name: Daily Price Update

on:
  schedule:
    # Runs at 03:00 UTC (~08:30 IST) every day
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated database back

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's prices
        env:
          AGMARKNET_API_KEY: ${{ secrets.AGMARKNET_API_KEY }}
        run: python fetch_prices.py

      - name: Commit updated database
        run: |
          git config user.name "price-bot"
          git config user.email "actions@github.com"
          git add data/prices.db
          git diff --staged --quiet || git commit -m "Auto-update: daily price pull $(date -u +%Y-%m-%d)"
          git push
